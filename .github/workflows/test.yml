name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.10
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o runtime.txt > /dev/null
      - run: uvx pip-audit==2.10.1 -r runtime.txt --disable-pip --no-deps
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check canvas_rag tests
      - run: uv build
      - name: Check installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/canvas-buddy-install"
          "$RUNNER_TEMP/canvas-buddy-install/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/canvas-buddy-install/bin/canvas-buddy" --version
          "$RUNNER_TEMP/canvas-buddy-install/bin/canvas-buddy" self-test
