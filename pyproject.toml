[project]
name = "canvas-buddy"
version = "0.3.0.dev0"
description = "A small local Canvas study companion, powered by your model CLI"
requires-python = ">=3.11"
dependencies = ["textual>=1,<7", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "python-dotenv>=1,<2", "pypdf>=5,<7"]
license = "MIT"

[project.scripts]
canvas-buddy = "canvas_rag.__main__:main"
canvas-rag = "canvas_rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvas_rag"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
